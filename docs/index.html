<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>iox app</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <!-- 在 github 中编辑 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-edit-on-github"></script>

  <style>
    :root {
      /* 封面 */
      --cover-color: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }

    /* 如果你想让封面背景完全应用这个颜色，有时需要强制覆盖一下样式 */
    section.cover {
      background: var(--cover-color) !important;
    }

    .app-name img {
      width: 130px;
    }

    /* 封面产品卡片网格 */
    .product-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px;
      margin: 40px auto;
      max-width: 1160px;
    }
    .product-card {
      flex: 1 1 260px;
      max-width: 300px;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 4px 20px rgba(100, 116, 139, 0.12);
      text-align: center;
      transition: transform .25s ease, box-shadow .25s ease;
      border: 1px solid rgba(255, 255, 255, 0.75);
    }
    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 32px rgba(100, 116, 139, 0.18);
    }
    .product-card h3 {
      margin: 0 0 10px;
      font-size: 20px;
      color: #334155;
    }
    .product-card h3 small {
      font-size: 12px;
      color: #64748b;
      font-weight: normal;
      background: #f1f5f9;
      padding: 2px 10px;
      border-radius: 10px;
      display: inline-block;
      margin-left: 6px;
      vertical-align: middle;
    }
    .product-card p {
      color: #64748b;
      font-size: 14px;
      min-height: 42px;
      margin: 0 0 20px;
      line-height: 1.6;
    }
    .card-links {
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    .card-links a {
      text-decoration: none;
      color: #475569;
      font-weight: 600;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      padding: 8px 28px;
      border-radius: 24px;
      transition: all .25s ease;
      background: rgba(255, 255, 255, 0.7);
    }
    .card-links a:hover {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }

    /* 响应式：屏幕缩小时自动减少列数 */
    @media (max-width: 1160px) {
      .product-grid { max-width: 860px; }  /* 3 张一排 */
    }
    @media (max-width: 900px) {
      .product-grid { max-width: 560px; }  /* 2 张一排 */
    }
    @media (max-width: 600px) {
      .product-grid { max-width: 300px; }  /* 1 张一排 */
    }
  </style>

</head>

<body>
  <div id="app">载入中 ...</div>
  <script>
    window.$docsify = {
      name: 'IOX APP', // 侧边栏顶部标题
      logo: './images/iox_logo_3.png', // 侧边栏图标
      repo: '',
      coverpage: true, // 使用 _coverpage.md 创建封面 
      onlyCover: true, // 仅显示封面， 不将首页与封面在同一页面中显示
      loadNavbar: true, // 使用 _navbar.md 创建顶部导航栏
      loadSidebar: true, // 使用 _sidebar.md 定义侧边栏
      subMaxLevel: 3, // 侧边栏中显示的标题最大层级
      tabs: { // 插件， 渲染出 tabs 标签 
        persist: true, // default
        sync: true, // default
        theme: 'classic', // default
        tabComments: true, // default
        tabHeadings: true // default
      },
      plugins: [
        EditOnGithubPlugin.create("https://github.com/ioxinfty/iox_app_web/blob/master/docs/", null, null)
      ]
    }
  </script>

  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- 图片缩放插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <!-- table -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1"></script>

</body>

</html>
